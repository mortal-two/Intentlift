agent:
  system_template: |
    You are the bounded source-blind Replay writer for IntentIR/SCRC. Generate
    the complete Replay source yourself from the immutable packet.json and the
    fixed public contract in /input. The sandbox contains no Source, Harness,
    compiler view, actual C values, Gate feedback, prior Replay, or network.

    Write exactly one final file, /output/replay.source. Fixed code may only
    reject and diagnose; it never generates, edits, patches, or certifies your
    source. You may run `intentir_replay_check /output/replay.source` as one
    entire tool action, then run
    `intentir_replay_compile_check /output/replay.source` as another complete
    action. The second tool is an advisory public synthetic compile profile,
    never Source/Harness/c0 and never a submission gate. Repair actionable
    diagnostics yourself. Finish
    with a separate `printf 'INTENTIR_REPLAY_SUBMIT\n'` action. Do not emit
    private chain-of-thought; make exactly one bash tool call per response.
  instance_template: |
    First run `intentir_packet_query overview`; it already contains the complete
    compact ABI/op inventory and exact root sizes. Then use
    `intentir_packet_query abi 0 48`, `graph 0 12`, `realization`, and paged
    `edges 0 24` only as directed by their `next` fields. Use `section PATH`
    only for a named omitted field and `find HANDLE` only when following one
    reference. Read REPLAY_CONTRACT.md once in one bounded action; TOOL.md is
    already summarized here. Never concatenate inputs because their middle may
    be transport-elided. Construct complete Triton source in
    /output/replay.source early. Run bounded ReplayCheck, then the advisory
    compile check, make focused corrections yourself, rerun both after edits,
    and submit. Produce a complete first source by turn 10. After every final
    source edit, rerun ReplayCheck and the advisory compile check so an
    already-reported frontend shape or syntax error is not knowingly
    resubmitted. Do not create another file under
    /output. A checker PASS is not an acceptance verdict; the writer
    independently reruns the same ingress after submission.
  step_limit: 40
  cost_limit: 0
  wall_time_limit_seconds: 1800
  max_consecutive_format_errors: 2
model:
  observation_template: |
    {%- if output.output | length < 12000 -%}
    {"returncode": {{ output.returncode }}, "turn_budget": {"used": {{ n_model_calls }}, "limit": {{ step_limit }}, "remaining": {{ step_limit - n_model_calls }}}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if step_limit > 0 and step_limit - n_model_calls <= 10 %}, "directive": "Stop browsing. Finish the complete source, rerun ReplayCheck and the advisory compile check after the final edit, repair actionable diagnostics, and submit now."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "turn_budget": {"used": {{ n_model_calls }}, "limit": {{ step_limit }}, "remaining": {{ step_limit - n_model_calls }}}, "output_head": {{ output.output[:6000] | tojson }}, "output_tail": {{ output.output[-6000:] | tojson }}, "elided_chars": {{ output.output | length - 12000 }}{% if step_limit > 0 and step_limit - n_model_calls <= 10 %}, "directive": "Stop browsing. Finish the complete source, rerun ReplayCheck and the advisory compile check after the final edit, repair actionable diagnostics, and submit now."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use the bash tool for the next bounded action. To submit, call bash with:
    printf 'INTENTIR_REPLAY_SUBMIT\n'
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: false
  # Same source-blind episode and exact message packet; no new semantic input.
  retry_attempts: 3
  use_global_model_stats: false
  cost_tracking: ignore_errors
environment:
  timeout: 60
  replay_check_limit: 7
  replay_submission_check_limit: 1
  replay_compile_check_limit: 7
