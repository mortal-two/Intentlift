agent:
  system_template: |
    You are the sole compiler owner for one fresh source-blind IntentIR Replay
    episode. Read the deterministic, read-only semantic program S_J from
    `/input/semantic-program.intent`; read `/input/frontend.json` and
    `/input/mask-c.json` for the callable ABI. Exact J and MaskC(C) remain available
    in `/input/packet.json`. No Source, pi,
    Harness valuation, Gate result, previous Replay, repository, or network exists.

    J/S_J is the sole semantic authority. Program mapping, layout, loops, control,
    carrier representation, target API, and materialization are source-blind compiler
    choices; they may not add or alter J-owned value semantics. Follow
    `/input/REPLAY_CONTRACT.md`.

    Treat `boundary_ownership` as one whole-program contract before choosing a
    schedule: preserve each authored logical access/effect, co-plan shared axes and
    all outputs, and do not independently serialize every output extent by default.
    Use J-only `domain_candidates` to keep related write domains in one guarded family;
    an attached C `tile_extent` is a blocked traversal axis, not automatically a launch
    axis.
    Keep domain bounds and access predicates distinct: scalar `coord < extent` domain
    bounds guard the corresponding effect group, while only the access row's authored
    predicate belongs in its load/store mask. Do not silently conjoin domain bounds into
    lane masks without an explicit J access-guard relation.

    Compile the whole S_J into one complete target program at
    `/output/replay.source`. You may globally choose target APIs, addressing,
    layouts, loops, control, synchronization, fusion, and code structure while
    preserving J semantics. Do not fill holes, produce
    per-node bindings, or wait for fixed code to assemble fragments.

    Work as a coding agent in this same episode: write an early complete draft,
    compile it, inspect only its own IR, patch it, and submit the exact final bytes.
    Keep inactive constexpr computations inside their branch.
    ReplayCheck and compile-check diagnose construction only; they neither generate
    code nor establish Gate1/Gate2. Model/tool counts are telemetry; wall time governs
    the episode. Keep prose short and never claim certification.

  instance_template: |
    The startup object below contains paths and byte counts only. Read
    `/input/semantic-program.intent`, `/input/frontend.json`, and `/input/mask-c.json`
    first, then `/input/REPLAY_CONTRACT.md` and `/input/TOOL.md`.
    Query only to cross-reference one named handle; do not reload the whole packet.

    <persistent-workspace-mirror>
    {{ replay_startup_context }}
    </persistent-workspace-mirror>

    Use `intentir_semantic_query overview|ownership|node REF|value REF|boundary NAME START COUNT`
    only for a local S_J lookup. Use `intentir_packet_query abi`, `graph`, `find`, or
    `section PATH` for exact local J/C facts. These are read-only projections, not plans.

    Submit a complete source with `submit_replay(source_text)` or by writing the
    single output file and calling `intentir_replay_submit /output/replay.source`.
    Use `intentir_replay_compile_check /output/replay.source`, then call the
    `replay_ttir_inspect jc` command documented in TOOL.md. Reinspect your own IR when
    one concrete J obligation remains; prefer targeted raw/find/observer lookups over
    dumping the full fingerprint. Remove work not authorized by S_J. Submission reruns closed
    construction checks; formal Gate1 remains outside and invisible.

  step_limit: 0
  cost_limit: 0
  wall_time_limit_seconds: 1800
  max_consecutive_format_errors: 0
  # This is not a call budget: only three consecutive identical requests with
  # identical Replay bytes and identical closed output terminate as a stall.
  max_consecutive_stagnant_steps: 3
  # Total calls remain uncapped.  These timers only detect elapsed time with no
  # exact Replay/work-file byte change.
  material_progress_advisory_seconds: 120
  material_progress_stall_seconds: 600

model:
  max_tool_calls_per_response: 4
  enable_replay_patch_tool: true
  enable_submit_replay_tool: true
  compact_tool_history: true
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 2
  # The initial user message contains only a small packet receipt. Exact authored
  # facts stay in the immutable workspace and enter context only through bounded
  # read-only query results selected by the Replay owner.
  compact_workspace_mirrors: false
  compact_response_history_keep_recent: 3
  use_previous_response_id: true
  # Initial J/MaskC interpretation keeps the requested effort. Only ordinary
  # own-source inspection, construction-check and exact repair turns use low.
  routine_reasoning_effort: low
  routine_timeout_seconds: 180
  # Turn 1 reads immutable J files; turn 2 is the first turn that can actually
  # compile them.  Keep both at the requested effort, then use low only for
  # ordinary own-source compile repair.
  semantic_initial_turns: 2
  observation_template: |
    {%- if output.output | length < 8000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:4000] | tojson }}, "output_tail": {{ output.output[-4000:] | tojson }}, "elided_chars": {{ output.output | length - 8000 }}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use one to four bash calls for the next bounded action. Multiple calls must
    be independent and read-only; use exactly one call for every write, inspect
    after write, check, commit, rollback, or direct submit.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: true
  # Same source-blind episode and exact message packet; no new semantic input.
  retry_attempts: 3
  retry_timeouts: true
  use_global_model_stats: false
  cost_tracking: ignore_errors

environment:
  timeout: 60
  # Zero means time-governed/unbounded-by-count; every call remains audited.
  replay_check_limit: 0
  replay_submission_check_limit: 0
  replay_compile_check_limit: 0
  replay_source_inspect_limit: 0
