agent:
  system_template: |
    Own one fresh source-blind IntentIR Replay. Read compiler index, complete
    S_J, frontend, and accepted C when present; packet holds exact J/C. No
    Source, pi, non-C Harness fact, Gate result, prior Replay, repo, or network
    exists.

    J/S_J and `/input/REPLAY_CONTRACT.md` are the sole semantic authority.
    Choose mapping, layout, loops, control, carriers, APIs, and materialization
    without changing J. Preserve each access/effect; domain guards remain
    separate from access predicates. Factor shared, tensor-specific, and C-tiled
    axes. A tile permits local tiling only, never a grid cardinality or extra
    `program_id`; C never supplies J semantics or callable constexpr `c*`.

    Compile all S_J into one complete `/output/replay.source`, not fragments or
    holes. Two orientation turns precede the first complete `submit_replay`.
    Then at most three unchanged inspections/queries may precede only an exact
    patch or complete submission. Inspect/compile only owned source; after
    preflight rejection patch that source before resubmission. Keep inactive
    constexpr work in its branch. ReplayCheck/compile-check only diagnose;
    they neither generate code nor establish Gate1/Gate2. No certification prose.

  instance_template: |
    The startup object is paths and byte counts only. Read its compiler index,
    S_J, frontend, accepted C when present, then contract and tool. Query one
    named handle at a time; do not reload the packet.

    <persistent-workspace-mirror>
    {{ replay_startup_context }}
    </persistent-workspace-mirror>

    `intentir_semantic_query` is only local S_J lookup; `intentir_packet_query`
    only exact local J/C facts. Both are read-only, not plans. First submit a
    complete source; then use exact patch or full replacement, never bash.
    Compile-check and inspect owned J/C IR; requery only one concrete J duty,
    remove non-J work, and patch before resubmission. Gate1 stays external.

  # This is a logical-turn ceiling, independent of the physical transport cap
  # below. It permits orientation, a complete first submission, and bounded
  # exact repairs, but cannot be extended by continuously changing source.
  step_limit: 24
  cost_limit: 0
  # Replay has no framework owner wall-time cap. Provider failures,
  # cancellation, step limits, and formal ingress/Gate authorities remain
  # independent fail-closed boundaries.
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 0
  # This is not a call budget: only three consecutive identical requests with
  # identical Replay bytes and identical closed output terminate as a stall.
  max_consecutive_stagnant_steps: 3
  # A source-blind Replay that has stopped changing its owned source cannot
  # gain Gate evidence by continuing to inspect the same immutable packet.
  # No elapsed-time heuristic terminates an active owner. Explicit step and
  # semantic ingress boundaries remain the only local lifecycle limits.
  material_progress_advisory_seconds: 0
  material_progress_stall_seconds: 0

model:
  # Replay environment batches are safe only for independent immutable-input
  # queries.  Writes, inspections, compile checks, commits, and submission
  # must each receive the preceding observation, so one model turn owns one
  # tool call.  This keeps the model/runtime contract aligned instead of
  # allowing a mixed batch to be rejected atomically after the model has
  # already spent a reasoning turn.
  max_tool_calls_per_response: 1
  enable_bash_tool: true
  enable_replay_patch_tool: true
  enable_submit_replay_tool: true
  compact_tool_history: true
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 2
  # The initial user message contains only a small packet receipt. Exact authored
  # facts stay in the immutable workspace and enter context only through bounded
  # read-only query results selected by the Replay owner.
  compact_workspace_mirrors: false
  # Keep only the latest response group in the provider packet; the full
  # Replay trajectory remains local and older groups become deterministic receipts.
  compact_response_history_keep_recent: 1
  # Send the exact locally compacted history directly across selectable
  # transports; no continuation identifier crosses a Replay turn.
  use_previous_response_id: false
  # Initial J/source-bound-C interpretation keeps the requested effort. Only ordinary
  # own-source inspection, construction-check and exact repair turns use low.
  routine_reasoning_effort: low
  # Do not impose a framework per-turn provider deadline. A provider failure
  # or incomplete stream remains fail-closed and cannot become Replay source.
  routine_timeout_seconds: null
  # Turn 1 reads immutable J files; turn 2 is the first turn that can actually
  # compile them.  Keep both at the requested effort, then use low only for
  # ordinary own-source compile repair.
  semantic_initial_turns: 2
  observation_template: |
    {%- if output.output | length < 8000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:4000] | tojson }}, "output_tail": {{ output.output[-4000:] | tojson }}, "elided_chars": {{ output.output | length - 8000 }}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use exactly one bash call for the next bounded action. Every write, inspect,
    check, commit, rollback, or direct submit must be its own model turn so its
    result is observed before the next action.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: false
  # Same source-blind episode and exact message packet; no new semantic input.
  # One physical provider attempt belongs to one Replay model turn. A timeout
  # is fail-closed and is recorded as provider infrastructure failure.
  retry_attempts: 1
  # One relay/service failure may be retried at the transport layer without
  # creating a second logical Replay episode or changing the submitted source.
  transient_retry_attempts: 1
  # Hard per-episode transport budgets. They are enforced immediately before
  # each real provider request, including retry/fallback calls inside one
  # logical turn; exhaustion ends Replay fail-closed.
  physical_provider_call_limit: 32
  transport_retry_limit: 1
  retry_timeouts: false
  use_global_model_stats: false
  cost_tracking: ignore_errors

environment:
  timeout: 60
  # Zero means time-governed/unbounded-by-count; every call remains audited.
  replay_check_limit: 0
  replay_submission_check_limit: 0
  replay_compile_check_limit: 0
  replay_source_inspect_limit: 0
  # Consecutive submission preflights for the same exact replay.source and
  # sanitized diagnostic may be repaired only this many times. The third
  # occurrence terminates the episode; it never becomes a semantic acceptance
  # or repair base.
  same_preflight_repair_limit: 2
