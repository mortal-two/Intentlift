agent:
  system_template: |
    You are the sole source-blind Replay owner for one fresh IntentIR/SCRC replay
    episode. Generate the complete Replay source yourself from exactly J, pi,
    anonymous MaskC(C), and the public contract in `/input/packet.json`. The
    sandbox contains no Source, Harness, compiler view, actual C values, Gate
    feedback, prior Replay, or network. This session ends after this one Replay;
    a changed J always receives a new source-blind owner.

    Write exactly one final file, `/output/replay.source`. For the first complete
    source prefer `submit_replay(source_text)`: it writes your exact bytes and
    runs the existing diagnostic-only ReplayCheck. For a focused correction use
    `apply_replay_patch(path, old_text, new_text, submit=true)`. Fixed code may
    reject, store, or replace your exact text and report closed diagnostics; it
    never generates, infers, semantically edits, or certifies Replay.

    Build from the packet in this order of understanding: first J's logical
    computation and structured control, then pi's authored realization, then the
    anonymous C slots and their use-sites. C values are intentionally absent;
    the Harness privately binds them only after Replay is complete.

    Inspect only your own current source with `intentir_replay_inspect`; run
    `intentir_replay_check /output/replay.source` for diagnostic preflight and
    `intentir_replay_compile_check /output/replay.source` for the public synthetic
    compile profile. These tools see no Source, Gate feedback or actual C values,
    prescribe no edit, and decide no acceptance. Repair the source yourself.
    Exact commit/rollback is an optional LLM-selected fallback, not automatic
    candidate selection. Submit with `intentir_replay_submit`; do not use a stdout
    marker.

    The initial message normally embeds the complete exact source-blind packet once.
    When `exact_packet_embedded=true`, consume it directly and draft source without
    first calling overview, requirements, ABI, graph, realization or obligations.
    For an oversized packet, the initial manifest already contains the exact
    authored-requirements checklist; use up to four independent focused queries in
    one response only for a named omitted page. Model/tool counts are telemetry;
    active wall time governs the episode. Produce and direct-submit complete Replay
    early, keep explanations short, and do not emit private chain-of-thought.

  instance_template: |
    The following is the exact immutable source-blind startup transport. It embeds
    the complete packet when it is within the fixed byte bound; otherwise it embeds
    one exact manifest and explicit continuation paths. It contains no Source
    information and is not a semantic summary.

    <persistent-workspace-mirror>
    {{ replay_startup_context }}
    </persistent-workspace-mirror>

    If `exact_packet_embedded=true`, use its `packet` directly. Otherwise consume
    `manifest.overview` and `manifest.authored_requirements`, then query only a
    named omitted ABI/graph/boundary/realization page. Use `section PATH`,
    `obligation HANDLE`, or `find HANDLE` only for one omitted named fact. Packet
    queries expose exact authored facts and never infer a realization. Reconcile
    every J op occurrence, boundary access/effect, pi instance mechanism,
    route/order relation, and time/control relation before submitting.
    Treat `critical_facts.lexical_regions` as the exact region-by-region
    construction ledger and `critical_facts.cross_region_order` as the exact
    ordering checklist. Treat `critical_facts.broadcast_obligations` as the exact
    operand/access/consumer rank-projection checklist. These views only reindex
    the same J/pi and add no lowering fact. For each authored
    J.boundary.broadcasts item, preserve the operand's closed type at its producer
    and boundary access, then materialize the declared axes at that named consumer.
    Never pre-expand an access index or load shape, and never let implicit
    broadcasting erase the authored consumer stage.

    Preserve the typed rank, axis, structured control, recurrence and carrier
    relations authored by J and pi. Every J.signature p* is one already-existing
    callable ABI carrier. Repeated pi instances anchored to the same p* only scope
    or route uses of that one carrier; they never create another value or program
    coordinate. Placement=`program` does not turn p* into `tl.program_id`, and
    duplicate p* instances never authorize duplicate carrier reads or coordinates.
    Only a distinct typed J-domain realization authorized by the public frontend
    contract may create a program coordinate. A pi physical_iterations relation
    keeps the reduce/contraction logical in J while requiring its explicit physical loop;
    resolve only its C-attached axis, induction basis and direction, and preserve
    every physical_loop_carriers temporal stage without inventing an update.
    An ordinary J effect_if remains an explicit runtime if/else. If one
    pi.terminal_controls item names its sibling arm-scope instances, emit the
    named terminal arm as a runtime if ending in bare return and then emit the
    named continuation arm without else; negate only when the negative arm is
    terminal. Never infer or copy its predicate, polarity, operations, or effects.
    Emit an explicit public reshape or
    expand-dimension step when it is required to realize an authored operand
    shape or local reduction axis; do not replace it with a merely
    value-equivalent flattened formula. A constexpr p* without `logical_ref` is
    only a fixed-Harness-specialization ABI carrier: retain it, but do not invent
    a dummy logical use or reconstruct an inactive variant.

    Construct and direct-submit complete Triton source early. If preflight fails,
    keep editing the same `/output/replay.source`; inspect your current source,
    then run `intentir_replay_obligation_audit /output/replay.source` whenever the
    exact critical ledger contains broadcast obligations, lexical regions, or
    cross-region order. Compare
    that ledger against your numbered current bytes yourself. Any later source edit
    requires another audit of the new exact bytes. The audit diagnoses nothing and
    supplies no mapping or repair.
    call ReplayCheck and the public synthetic construction compile check. Apply
    focused exact changes and resubmit. Submission reruns both checks for changed
    bytes. Their PASS only closes Replay construction; it is not Gate1, semantic
    membership, or certification. The external writer independently repeats
    ingress after submission. Create no other file under `/output`.

  step_limit: 0
  cost_limit: 0
  wall_time_limit_seconds: 1800
  max_consecutive_format_errors: 0
  # This is not a call budget: only three consecutive identical requests with
  # identical Replay bytes and identical closed output terminate as a stall.
  max_consecutive_stagnant_steps: 3
  # Total calls remain uncapped.  These timers only detect elapsed time with no
  # exact Replay/work-file byte change.
  material_progress_advisory_seconds: 120
  material_progress_stall_seconds: 600

model:
  max_tool_calls_per_response: 4
  enable_replay_patch_tool: true
  enable_submit_replay_tool: true
  compact_tool_history: true
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 2
  # The initial user message contains only a small packet receipt. Exact authored
  # facts stay in the immutable workspace and enter context only through bounded
  # read-only query results selected by the Replay owner.
  compact_workspace_mirrors: false
  compact_response_history_keep_recent: 3
  use_previous_response_id: true
  # Initial J/pi/MaskC interpretation keeps the requested effort. Only ordinary
  # own-source inspection, construction-check and exact repair turns use low.
  routine_reasoning_effort: low
  routine_timeout_seconds: 180
  semantic_initial_turns: 1
  observation_template: |
    {%- if output.output | length < 8000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:4000] | tojson }}, "output_tail": {{ output.output[-4000:] | tojson }}, "elided_chars": {{ output.output | length - 8000 }}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 180 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Replay wall time is nearly exhausted; submit a checked complete source."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use one to four bash calls for the next bounded action. Multiple calls must
    be independent and read-only; use exactly one call for every write, inspect
    after write, check, commit, rollback, or direct submit.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: true
  # Same source-blind episode and exact message packet; no new semantic input.
  retry_attempts: 3
  retry_timeouts: true
  use_global_model_stats: false
  cost_tracking: ignore_errors

environment:
  timeout: 60
  # Zero means time-governed/unbounded-by-count; every call remains audited.
  replay_check_limit: 0
  replay_submission_check_limit: 0
  replay_compile_check_limit: 0
  replay_source_inspect_limit: 0
