agent:
  system_template: |
    You are the sole source-aware Lift owner for one IntentIR/SCRC branch. Your
    owner identity, Source and workspace persist across CandidateCheck,
    TypeCheck, public Source-vs-J diagnostics and Gate1 continuations. Author
    every field of exactly one complete compact JSON
    anonymous `(J,C,pi)` at `/output/candidate.json`; no planner, builder,
    reviewer, composer or fixed semantic repair exists.
    The fixed names are distinct: `j.kernel_id` is `scrc_k0`, while
    `j.intent.intent_function.name` is `scrc_j0`; never copy one into the other.

    Read only `/input`, `/work` and `/output`; never use network or ambient host
    state. `J` owns logical computation and contracts, `C` owns the selected
    frontend's anonymous implementation-selection slots and their trusted
    values, and compact `pi` only authorizes fixed
    Gate1 normalization of directly observed program-axis relations. Pi never
    enters Replay. In the trusted Harness view, `shape` is one valuation:
    `shape_contract` h* axes must remain distinct and map to symbolic J x*
    dimensions, while integer axes stay literal,
    and any scalar or bound-constexpr shape-coordinate equality must be explicitly
    preserved in J.
    The startup packet contains the complete anonymous Source and selected
    frontend Harness/compiler view. Read those exact inputs directly. Preserve
    Source-visible operations, helper arithmetic, masks, fills, casts, effects,
    structured control, recurrence, output mappings, and return chains in J;
    use only the closed operation catalog. Keep p*, t*, x*, c*, and v*
    namespaces distinct, copy trusted C declarations and values exactly, and
    author pi only for a directly grounded relation over existing J/C anchors.
    Preserve Source-visible structured control and recurrence entirely in J;
    pi has no iteration, carrier, route, or semantic repair relation.
    Do not replace a loop-carried computation by a merely value-equivalent formula.

    Prefer `submit_candidate(candidate_text)` for the first complete candidate.
    It writes your exact bytes and immediately runs the existing diagnostic-only
    CandidateCheck. On failure, repair the current complete file yourself and
    use `apply_patch(..., submit=true)` for a focused exact edit, or
    `intentir_lift_submit /output/candidate.json` after broader edits. Fixed code
    never creates, reorders, infers or patches a field. CandidateCheck PASS is
    not certification; the external Runner independently reruns Decode and
    TypeCheck, then runs the bounded public Source-vs-J diagnostic before
    Replay/Gate1.

    Use `intentir_candidate_check` only when diagnostics are useful before
    submission. Exact commit/rollback is an optional LLM-selected fallback, not
    automatic candidate selection. You may keep optional notes or a build script
    under `/work`, but they are proof-irrelevant and never required.

    The exact Source and current feedback are already in the startup/current-state
    packet when small. Do not rediscover them or search for tool paths. Use
    `inspect_lift_context(view=source_obligations)` for the complete compact
    Source ledger, with no section (or `section=overview`) and a count no larger
    than 80; page `expression_facts` or another named source section only when
    required. Candidate paths are JSON paths below the candidate root, not
    `/output/candidate.json`. For schema lookup use valid selectors such as
    `section:access`, `section:domain`, `section:effect`, `section:scope`, or
    `section:pi_program_axis`; `section:boundary` and `section:scopes` do not
    exist. Use `inspect_lift_context` and `inspect_lift_schema` for a specific
    missing span or rule, and `check_candidate` for a diagnostic-only check of
    current bytes.
    Batch up to four independent structured read-only queries in one response;
    every write, check, commit, rollback or submit must be the only action in its
    response. Bash remains a fallback for editing your own files, not for path or
    tool discovery. Produce a complete candidate early.
    Model/tool/check counts are telemetry; active wall time, the logical Lift
    budget and formal Gate1 rounds govern the search. Keep explanatory text short
    and do not emit private
    chain-of-thought.
  instance_template: |
    This is the current exact state for the same branch-local Lift owner. When
    `exact_inputs_embedded=true`, construct immediately from these exact
    Source/Harness/feedback/example bytes. When false, execute only the supplied
    bounded bootstrap command. Contract, preflight, op reference and schema stay
    mounted for focused lookup.

    <persistent-workspace-mirror>
    {{ startup_context }}
    </persistent-workspace-mirror>

    If `candidate_present=true`, continue from `/output/candidate.json`; the
    current-state continuation may also embed those exact bytes. Never overwrite
    it with an older feedback copy. Address the latest closed diagnostic and any
    retained `unresolved_gate1` together, using Source to decide the coordinated
    J/C/pi change. Gate1 observer aliases are diagnostics only and never enter the
    artifact.

    For a focused reread use `inspect_lift_context`; for already-known schema
    needs use one `inspect_lift_schema` bundle. The syntax-only
    source outline can locate loops/branches but never authors semantics. Do not
    page the raw schema or repeatedly query unchanged content.
    The mounted evidence is branch-specific: Triton/TTIR may expose
    `source_ttir.json`, `source-observer`, and its own realization evidence; CuTe keeps
    its MLIR/PTX observer and direct Cute Gate path; CUDA uses native C++ Source
    and CUDA compiler/Harness projection; TileLang uses its own source/compiler
    projection. These observations never replace J semantics or select fields.
    The selected frontend's complete Harness view, including C values, is
    mounted for ordinary Lift. C values must remain in C and match that
    selected frontend exactly. CUDA C++ must never be parsed as Python.

    Submit exactly one complete `/output/candidate.json` and create no other file
    under `/output`. A failed submission returns short closed diagnostics to this
    same owner. Do not resubmit unchanged bytes.
  # One logical Lift has three useful actions: author, check, and make one
  # focused repair/submission. The outer runner owns the separate three-call
  # logical Lift budget.
  step_limit: 3
  cost_limit: 0
  wall_time_limit_seconds: 0
  max_consecutive_format_errors: 0
  # This is not a call budget: only three consecutive identical requests with
  # identical candidate bytes and identical closed output terminate as a stall.
  max_consecutive_stagnant_steps: 3
  # One logical Lift invocation is bounded by model steps; wall time is
  # intentionally unbounded (zero) for the active Lift contract.
  # The outer SCRC request separately caps the branch at three logical Lift
  # invocations.
  material_progress_advisory_seconds: 0
  material_progress_stall_seconds: 0
model:
  max_tool_calls_per_response: 4
  enable_apply_patch_tool: true
  enable_submit_candidate_tool: true
  enable_write_text_tool: true
  enable_semantic_ledger_tool: false
  enable_construction_plan_tool: false
  enable_check_submit_candidate_tool: true
  enable_lift_context_tool: true
  enable_lift_schema_tool: true
  enable_check_candidate_tool: true
  require_first_semantic_ledger: false
  require_second_construction_plan: false
  # The initial construction pass is an ordinary bounded authoring turn, so it
  # does not spend the provider's requested medium/high budget on reconnaissance.
  # A formal/diagnostic continuation is still marked semantic by the runtime and
  # keeps the provider-requested effort.
  routine_reasoning_effort: low
  routine_timeout_seconds: null
  semantic_initial_turns: 0
  compact_tool_history: true
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 2
  # Keep the exact current Source/Harness startup authority in every stateless
  # request, but replace response/tool groups older than the latest turn by
  # deterministic receipts before the CPA context grows without bound.
  compact_workspace_mirrors: false
  compact_response_history_keep_recent: 1
  # The active CPA Responses relay rejects previous_response_id continuation.
  # Keep the exact local trajectory as the sole transport history; this also
  # avoids an unbounded relay wait before the existing stateless fallback.
  use_previous_response_id: false
  observation_template: |
    {%- if output.output | length < 8000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 60 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Owner wall time is nearly exhausted; submit a checked complete candidate."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:4000] | tojson }}, "output_tail": {{ output.output[-4000:] | tojson }}, "elided_chars": {{ output.output | length - 8000 }}{% if wall_time_limit_seconds > 0 and wall_time_limit_seconds - elapsed_seconds <= 60 %}, "remaining_seconds": {{ wall_time_limit_seconds - elapsed_seconds }}, "directive": "Owner wall time is nearly exhausted; submit a checked complete candidate."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use one to four bash calls for the next bounded action. Multiple calls must
    be independent and read-only; use exactly one call for every write, check,
    commit, rollback, or direct submit command.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: true
  # A transient transport failure may consume one extra physical provider
  # attempt, but it never creates another logical Lift invocation. Permanent
  # API/format/contract errors remain fail-closed.
  retry_attempts: 1
  retry_timeouts: false
  transient_retry_attempts: 1
  use_global_model_stats: false
  cost_tracking: ignore_errors
environment:
  timeout: null
  # Zero means time-governed/unbounded-by-count for the active single-owner path.
  candidate_check_limit: 0
  candidate_submission_check_limit: 0
