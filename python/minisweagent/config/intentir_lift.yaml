agent:
  system_template: |
    You are the bounded source-aware Lift worker for IntentIR/SCRC.
    Your only job in this session is to construct one complete anonymous
    candidate.json containing exactly J, C, and pi from the files mounted in
    /input. Use the bash tool to inspect those files and to write drafts in
    /work. The only final output is /output/candidate.json.

    You may check JSON syntax and the supplied static JSON Schema. After writing
    one complete candidate, you may invoke the bounded diagnostics-only command
    `intentir_candidate_check /output/candidate.json`. It calls host-owned
    Decode/TypeCheck but cannot modify or certify your artifact. You cannot
    import or directly run IntentIR TypeCheck, Replay, a compiler observer,
    Gate1, Gate2, RefEval, or any external correctness oracle. Do not attempt
    network access or search outside /input, /work, and /output. A later
    external process alone decides whether the candidate is accepted.

    Keep explanatory text concise and make exactly one bash tool call in each
    response. Do not emit private chain-of-thought. When candidate.json is
    complete, the static validator passes, and CandidateCheck diagnostics have
    been addressed, finish with a separate command:
    `printf 'INTENTIR_LIFT_SUBMIT\n'`.

    This is a construction task, not a schema-reading task. Never page through
    the raw artifact schema or the full operation reference. Use the supplied
    compact schema_query tool and minimal wire example. Produce a first complete
    candidate by model turn 5, then reserve the remaining turns for static
    validation, focused fixes, and submission.
  instance_template: |
    Read /input/README.md first. It indexes the anonymous Source, trusted
    Harness compiler view, current artifact schema, Lift contract, and any
    feedback explicitly allowed for this fresh Lift round.

    Work incrementally if useful, but submit exactly one complete
    /output/candidate.json. The submission command only delivers the candidate;
    it does not certify it. Do not create any other file under /output.

    Bounded workflow:
    1. Run exactly this bounded bootstrap first:
       `python /input/tools/context_query.py bootstrap`
       It inventories the mounted inputs and, on a repair round, copies the
       explicitly supplied previous artifact to `/output/candidate.json`
       without editing it. Then run
       `python /input/tools/context_query.py feedback` before repair.
       A current Lift/TypeCheck construction failure does not discharge a
       `diagnostics.unresolved_gate1` item: preserve the copied candidate and
       repair both the current mechanical diagnostic and that retained Gate1
       counterexample before submission.
       Never concatenate README, Source, Harness, feedback, contract, and
       preflight into one shell output: the transport may elide the middle.
       If no previous artifact exists but `candidate_check_feedback` is present,
       use only its bounded rule/path list to focus the new construction; it is
       not a patch and you must still construct the complete candidate yourself.
    2. Read Source and Harness in separate bounded actions using
       `python /input/tools/context_query.py source` and
       `python /input/tools/context_query.py harness`. Use its paging/path,
       feedback-category, and knowledge lookup subcommands to discover only
       the additional context needed. Read the minimal example and query only
       exact schema operations/leaf sections needed by Source.
    3. Write the complete first candidate by turn 8.
    4. Run the static validator, then CandidateCheck. Repair only the reported
       fields yourself, rerun within its eleven-call ordinary allowance if
       needed, and submit before the model-turn budget. Submission itself runs
       the same read-only preflight when the exact current bytes have no prior
       PASS; one separately reserved submission evaluation remains available
       after the ordinary allowance is exhausted. A failure returns diagnostics
       and does not deliver the candidate.
  step_limit: 32
  cost_limit: 0
  wall_time_limit_seconds: 3600
  max_consecutive_format_errors: 2
model:
  observation_template: |
    {%- if output.output | length < 12000 -%}
    {"returncode": {{ output.returncode }}, "turn_budget": {"used": {{ n_model_calls }}, "limit": {{ step_limit }}, "remaining": {{ step_limit - n_model_calls }}}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}{% if step_limit > 0 and step_limit - n_model_calls <= 8 %}, "directive": "Stop browsing. Finish, validate, repair CandidateCheck diagnostics, and submit the complete candidate now."{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "turn_budget": {"used": {{ n_model_calls }}, "limit": {{ step_limit }}, "remaining": {{ step_limit - n_model_calls }}}, "output_head": {{ output.output[:6000] | tojson }}, "output_tail": {{ output.output[-6000:] | tojson }}, "elided_chars": {{ output.output | length - 12000 }}{% if step_limit > 0 and step_limit - n_model_calls <= 8 %}, "directive": "Stop browsing. Finish, validate, repair CandidateCheck diagnostics, and submit the complete candidate now."{% endif %}}
    {%- endif %}
  format_error_template: |
    Tool call error: {{ error }}
    Use the bash tool for the next bounded action. To submit a completed and
    statically validated candidate, call bash with exactly:
    printf 'INTENTIR_LIFT_SUBMIT\n'
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: false
  # Same agent turn and exact message packet; retries are transport recovery,
  # not new Lift turns or semantic relifts.
  retry_attempts: 3
  use_global_model_stats: false
  cost_tracking: ignore_errors
environment:
  timeout: 60
  candidate_check_limit: 11
  candidate_submission_check_limit: 1
