agent:
  system_template: |
    Own one fresh source-aware Lift. Only bounded MCP facts and rule-level
    prior feedback are visible; CandidateCheck, Decode, TypeCheck,
    SourceReconcile, Replay, Gate1, and Gate2 are external.

    Use only `mcp_call_tool` and its exposed action: no prose, files, free
    candidate/artifact/patch, C, or pi JSON. A semantic entry reads the brief
    then ledger. `prior_authoring_feedback` is rule-only, never a candidate or
    template. If the brief lists missing operation leaves, look up exactly that
    full `op:NAME` set in one call before begin.
    Every attempt starts from the semantic entry. Never use a previous
    candidate, rejected draft, trajectory, session, or repair base.

    The brief authorizes Source semantics/control/returns; the ledger alone
    authorizes ordered accesses, owners, fills, and output slots. Follow the
    exposed chain only: begin, non-empty graph, post-graph ledger read,
    accesses, outputs, finalize. A lookup is only `{items:["op:NAME"]}` and
    every declaration is one JSON value in its named argument.

    Author Source-visible J only: typed SSA graph, domains, accesses,
    predicates/fills, control, output selections, and J-proven normalization.
    Host owns canonical handles/scopes and access/effect ids, ABI/C,
    returns/attachments, typed rows, and other pi. The provider explicitly
    authors each paired effect kind/target/node owner with its access. Each
    output selects one local result or `t*`.

    Use only Source `t*`, local `id`/`result`, `dim*`, and exact `access*`.
    `op` is canonical but `id` is local; accesses use their label+ordinal, not
    an op id. Operands use only `provider_ref` (`t*`), never `argN`, `localN`,
    attributes, calls, or dimensions; every result has a full type. Never emit
    canonical ids, ABI/C rows, returns, or `p*` as a logical tensor/index.

    Preserve proven order, control, typed addresses, and fills. A predicate is
    an earlier typed bool with one guard projection; a masked load names its
    direct single-result consumer. Do not invent any of these. Every ABI output
    needs a visible input or typed result; affine accesses stay accesses and
    iota/gather/scatter need proven typed integer indexing. Capacity masks are
    predicates, never dimensions/iota; keep frontend facts outside J/C/pi.
  instance_template: |
    Start as a new owner. This receipt has only bounded MCP resource metadata,
    never Source, Harness, feedback, schema, or candidate content:

    <mcp-startup-receipt>
    {{ startup_context }}
    </mcp-startup-receipt>

    Read brief and ledger before authoring. Prior feedback is rule-only. Do not request
    Source, reconstruct host mechanics, copy observer/Replay aliases into J/C/pi,
    create files, or restart unchanged work. Frontends stay separate; CUDA is
    never parsed as Python. End only with `finalize_candidate`.
  # The dynamic MCP surface exposes one legal transaction edge per turn.
  # Entry reads brief then transfer ledger, and reads the exact bounded set of
  # missing operation leaves in one call when the Source spine requires it.
  # The construction chain is begin, graph, graph-after-ledger-read, accesses,
  # outputs, finalize.
  # A semantic entry has seven mandatory edges when its compact source brief
  # is complete, or eight when it requires one exact operation-leaf lookup (brief,
  # ledger, lookup, begin, graph, accesses, outputs, finalize). Leave enough
  # room for bounded format and semantic correction.  A normal fresh semantic
  # entry needs eight turns (brief, ledger, one required leaf-set lookup, begin,
  # graph, accesses, outputs, finalize). Complex real kernels can need the
  # whole declaration chain plus several distinct, receipt-driven corrections;
  # sixteen turns can terminate that live construction before it reaches the
  # required finalize edge. Thirty-two is an explicit recorded owner budget;
  # exact stagnation still stops non-progress.
  step_limit: 32
  cost_limit: 0
  # Real Lift owners have no framework wall-time cap. Provider failure,
  # cancellation, explicit step limits, and the semantic authorities remain
  # independent fail-closed boundaries.
  wall_time_limit_seconds: 0
  # A dynamic one-edge MCP surface means repeated malformed tool responses
  # cannot discover new construction facts. Stop them before the 32-turn
  # semantic budget is spent; this is an orchestration failure, not a relaxed
  # CandidateCheck or semantic repair.
  max_consecutive_format_errors: 3
  max_consecutive_stagnant_steps: 3
  material_progress_advisory_seconds: 0
  material_progress_stall_seconds: 0
model:
  max_tool_calls_per_response: 4
  enable_bash_tool: false
  enable_lift_mcp_tool: true
  require_first_lift_mcp: true
  # Do not silently downgrade the provider-selected Lift effort on routine
  # MCP turns.  The owner receives the same effort that the request records;
  # compact MCP projections, rather than a hidden low-effort override, bound
  # the agent workload.
  routine_reasoning_effort: null
  # Every Lift turn is an MCP construction turn (`semantic_initial_turns: 0`).
  # Do not impose a framework per-turn deadline: a valid high-effort Responses
  # stream may require more time to emit its completed SSE envelope. A failed
  # or incomplete stream still remains a provider-preparation failure and can
  # never yield a partial candidate or repair base.
  routine_timeout_seconds: null
  semantic_initial_turns: 0
  compact_tool_history: true
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 4
  compact_workspace_mirrors: false
  compact_response_history_keep_recent: 4
  # Keep Responses requests stateless across all selectable transports. The
  # bounded local MCP history is the only carry-over within a fresh Lift.
  use_previous_response_id: false
  observation_template: |
    {%- if output.output | length < 8000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:4000] | tojson }}, "output_tail": {{ output.output[-4000:] | tojson }}, "elided_chars": {{ output.output | length - 8000 }}}
    {%- endif %}
  format_error_template: |
    MCP call error: {{ error }}
    Use bounded MCP resource reads to locate the issue. Use exactly one MCP
    write or check call for a response.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: false
    # Accept only a stream with a completed Responses envelope; a closed
    # function-call item cannot replace a missing completion event.
    stream: true
  retry_attempts: 1
  retry_timeouts: false
  # An incomplete Responses stream is a Lift preparation failure.  It has no
  # candidate or semantic evidence, so return it directly instead of spending
  # another provider attempt or logical Lift call.
  # One retry is transport-only: it is used only when the remote Responses
  # stream itself fails before a completed model turn. It never reuses a
  # partial candidate and never consumes another logical Lift invocation.
  transient_retry_attempts: 1
  use_global_model_stats: false
  cost_tracking: ignore_errors
environment:
  timeout: null
  candidate_check_limit: 0
  candidate_submission_check_limit: 0
