agent:
  system_template: |
    Fresh semantic MCP Lift. Use only the currently exposed mcp_call_tool action;
    do not read files, emit prose/free JSON/C/pi, or reuse any old artifact.
    Critical multi-store join: each physical-store owner root is one slice;
    assembly.operand_store_ordinals[i] selects that exact owner root, and one
    new top-level concat consumes those fresh slice results in listed order and
    produces the exact assembly.result_type. Slice roots alone are incomplete.
    At every turn perform exactly the exposed action. On failure, use only
    rule_code, rule_path, expected_relation, actual_relation, repair_scope and
    next_legal_action from that response; change only the stated scope.

    Required order: brief → transfer ledger → one exact schema lookup only if
    exposed → begin_candidate → operation graph → required transfer reread →
    accesses → outputs → boundary → finalize. Never skip, repeat, or reorder an
    exposed read/write. Finalize once; a failed owner is not a repair base.

    Declare only Source-visible J semantics: canonical operation names, typed
    provider-local SSA values, Source-order accesses, proven predicates/fills,
    and output value choices. Use only names and relations exposed by MCP.
    Preserve Source producer order, masks, domains, and types. Do not invent
    predicates, owners, coordinates, operations, padding, identities, or ids.

    Every graph call replaces the whole body; it never appends. Submit one
    complete non-empty producer-order graph in one call, never a row or patch.
    Include exactly one row per item in begin receipt
    `source_operation_requirements`, every
    listed owner DAG, and all required family/attribute counts. Use canonical_op
    as op; preserve source_dependencies and exact Source attrs. Source refs are
    locators, not J ids/results/operands. Give every row operands as an array
    (use [] for zero-input ops) and fresh local id/result labels. The host
    never fills missing rows, producers, owners, or results.
    Make each typed_output_requirement visible as an exact typed graph result
    or Source input before output mapping; mapping cannot create/promote it.
    For `operation_graph_must_expose_each_source_output_type`, use the returned
    `required_output_type`; matching-value count is diagnostic only. Rebuild
    from the current Source producer chain; never choose a producer by type
    alone, add a dummy row, or copy a rejected graph. Preserve full Responses
    tool history.
    For shape/type errors, use only the returned expected dtype/shape and
    repair rule on the named row; preserve op/attrs/operands/result and resend
    the complete graph. Never infer a broadcast or alter another row.
    Symbolic extents must be listed provider_dimension_aliases[].local values
    (`dimN`); integer extents stay literal. Never use argument/tensor/ABI/SSA
    labels as extents or rename an unknown dimension by guess. For mask errors
    distinguish `no_boolean_result` from `no_exact_shape_projection` and use
    only an existing Source-proven i1 relation. Missing family counts locate
    Source obligations; they never permit dummy rows. Rebuild from current
    Source facts, never from a rejected graph.
    A Source requirement is one leaf, not a parent/example. Preserve its
    canonical result relation with a fresh local label; copy canonical_attrs.fn
    exactly for map/reduce operations. Expand source_unit_count only by its
    Source-proven relation. Boundary transfers are accesses; program_id is
    host-projected.
    Mirror each source_owner_producer_requirement using its transfer ordinal
    and exact source_owner_authoring_outline.graph. For a physical_store_slice,
    its root owns only that slice. If logical assembly is listed, make one
    top-level concat over the exact ordered fresh slice roots and use only the
    specified axis/result type. Do not substitute a same-shaped value or
    promote one slice to the logical output.
    For each transfer-row owner_broadcast_requirements entry, map its graph
    consumer and operand position to the corresponding local operation and
    operand result; copy target_axes exactly into boundary.broadcasts.axes.
    For a transfer-row predicate_requirement, use only its existing Source
    proof and semantic_guard_authorization. A computed guard needs one
    access_guard_relations row: access_ref=Source access_label,
    value_ref=its local i1 result, polarity=positive, axes=the unique
    Source-proven target-axis insertion; set that access predicate to "true".
    Match its op/axis/extent to the exposed Source facts; never infer them.
    After a successful graph, reread the transfer ledger before declaring
    accesses or outputs; do not expect begin_candidate to contain those rows.
    For access rows, copy fixed Source fields exactly. If
    `index_expression` is provider-owned, submit a real local expression,
    never `<...>` or null; provider-owned predicate/node/effect labels must be
    local labels already proven by the graph.

    Host owns schema, canonical ids, scopes, effects, ABI/C, returns and pi.
    Never emit host n*/v*/x*/p*/c*/a*/e* ids, owner tokens, or TTIR/Triton
    operation spellings. If a response says no progress, stop the current
    authoring path; do not try a different whole graph.
  instance_template: |
    Fresh owner. Read only the currently exposed MCP resource/tool, follow its
    next_legal_action, and submit one complete semantic candidate through the
    ordered chain. Use bounded failure metadata for local correction only.

    <mcp-startup-receipt>
    {{ startup_context }}
    </mcp-startup-receipt>
  # The dynamic MCP surface exposes one legal transaction edge per turn.
  # Entry reads brief then transfer ledger, and reads the exact bounded set of
  # missing operation leaves in one call when the Source spine requires it.
  # The construction chain is begin, graph, graph-after-ledger-read, accesses,
  # outputs, finalize.
  # A semantic entry has seven mandatory edges when its compact source brief
  # is complete, or eight when it requires one exact operation-leaf lookup (brief,
  # ledger, lookup, begin, graph, accesses, outputs, finalize). Leave enough
  # room for bounded format and semantic correction.  A normal fresh semantic
  # entry needs eight turns (brief, ledger, one required leaf-set lookup, begin,
  # graph, accesses, outputs, finalize). Complex real kernels can need the
  # whole declaration chain plus several distinct, receipt-driven corrections;
  # sixteen turns can terminate that live construction before it reaches the
  # required finalize edge. Thirty-two is an explicit recorded owner budget;
  # exact stagnation still stops non-progress.
  step_limit: 32
  cost_limit: 0
  # Real Lift owners have no framework wall-time cap. Provider failure,
  # cancellation, explicit step limits, and the semantic authorities remain
  # independent fail-closed boundaries.
  wall_time_limit_seconds: 0
  # A dynamic one-edge MCP surface means repeated malformed tool responses
  # cannot discover new construction facts. Stop them before the 32-turn
  # semantic budget is spent; this is an orchestration failure, not a relaxed
  # CandidateCheck or semantic repair.
  max_consecutive_format_errors: 3
  max_consecutive_stagnant_steps: 3
  material_progress_advisory_seconds: 0
  material_progress_stall_seconds: 0
model:
  max_tool_calls_per_response: 4
  enable_bash_tool: false
  enable_lift_mcp_tool: true
  require_first_lift_mcp: true
  # Do not silently downgrade the provider-selected Lift effort on routine
  # MCP turns.  The owner receives the same effort that the request records;
  # compact MCP projections, rather than a hidden low-effort override, bound
  # the agent workload.
  routine_reasoning_effort: null
  # Every Lift turn is an MCP construction turn (`semantic_initial_turns: 0`).
  # Do not impose a framework per-turn deadline: a valid high-effort Responses
  # stream may require more time to emit its completed SSE envelope. A failed
  # or incomplete stream still remains a provider-preparation failure and can
  # never yield a partial candidate or repair base.
  routine_timeout_seconds: null
  semantic_initial_turns: 0
  # MCP tool calls and their outputs are semantic conversation state. They
  # must be resent in full on every stateless Responses request.
  compact_tool_history: false
  compact_tool_arguments_over_chars: 2048
  compact_tool_outputs_keep_recent: 4
  compact_workspace_mirrors: false
  compact_response_history_keep_recent: 0
  # Keep Responses requests stateless: no server-side state and no response-id
  # continuation. The complete local history is the only carry-over.
  use_previous_response_id: false
  observation_template: |
    {%- if output.output | length < 12000 -%}
    {"returncode": {{ output.returncode }}, "output": {{ output.output | tojson }}{% if output.exception_info %}, "exception": {{ output.exception_info | tojson }}{% endif %}}
    {%- else -%}
    {"returncode": {{ output.returncode }}, "output_head": {{ output.output[:6000] | tojson }}, "output_tail": {{ output.output[-6000:] | tojson }}, "elided_chars": {{ output.output | length - 12000 }}}
    {%- endif %}
  format_error_template: |
    MCP call error: {{ error }}
    Use bounded MCP resource reads to locate the issue. Use exactly one MCP
    write or check call for a response.
  model_kwargs:
    drop_params: true
    num_retries: 0
    max_retries: 0
    parallel_tool_calls: false
    # Accept only a stream with a completed Responses envelope; a closed
    # function-call item cannot replace a missing completion event.
    stream: true
    store: false
  retry_attempts: 1
  retry_timeouts: false
  # A retryable SSE/stream-incomplete failure may use two additional physical
  # requests in this same logical turn. The third consecutive failed SSE
  # attempt is terminal; it never creates a candidate or repair base.
  transient_retry_attempts: 0
  sse_retry_attempts: 2
  use_global_model_stats: false
  cost_tracking: ignore_errors
environment:
  timeout: null
  candidate_check_limit: 0
  candidate_submission_check_limit: 0
