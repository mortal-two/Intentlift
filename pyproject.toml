[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentlift"
version = "0.0.0"
description = "Growing CUDA to IntentDSL compiler with independent execution validation"
requires-python = ">=3.10"
dependencies = ["openai>=2"]

[project.scripts]
intentlift = "intentlift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
